name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: |
          echo "=== Kiểm tra cấu trúc thư mục trên GitHub ==="
          ls -la
          # Tự động xử lý nếu người dùng upload nhầm cả thư mục cha BatteryPowerMonitor
          if [ ! -f "settings.gradle.kts" ]; then
            SUBDIR=$(find . -maxdepth 2 -name "settings.gradle.kts" | head -n 1 | xargs dirname 2>/dev/null || true)
            if [ -n "$SUBDIR" ] && [ "$SUBDIR" != "." ]; then
              echo "Phát hiện mã nguồn nằm trong thư mục con: $SUBDIR"
              cd "$SUBDIR"
            fi
          fi
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BatteryPowerMonitor-debug-apk
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
